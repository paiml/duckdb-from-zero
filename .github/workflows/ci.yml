name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  DUCKDB_VERSION: "1.5.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `gate` aggregator below is the status check the main-branch ruleset
  # keys off of; matrix expansion does not emit a check with that bare name.
  gate-matrix:
    name: gate-matrix (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org/ | DUCKDB_VERSION="${DUCKDB_VERSION}" sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: data
          key: fixtures-${{ runner.os }}-${{ env.DUCKDB_VERSION }}-${{ hashFiles('scripts/fetch-data.sh') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Fetch fixtures
        run: make fetch

      - name: Verify fixtures
        run: make verify

      - name: Test
        run: cargo test --workspace --all-targets --release

      - name: Release build
        run: cargo build --release --workspace

      - name: Capstone smoke (customers --limit 3)
        run: cargo run --release --bin duckdb-reports -- --report customers --limit 3

  # Quality tools run as separate pinned jobs, not in the learner setup.
  pv-lint:
    name: pv-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pv
        env:
          PV_VERSION: v0.31.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="pv-${PV_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/paiml/aprender/releases/download/${PV_VERSION}/${archive}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${archive}/pv" "$RUNNER_TEMP/bin/pv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/pv" --version

      - name: Lint contracts
        run: pv lint contracts/

  pmat-comply:
    name: pmat-comply
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pmat
        env:
          PMAT_VERSION: v3.16.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="pmat-${PMAT_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/paiml/paiml-mcp-agent-toolkit/releases/download/${PMAT_VERSION}/${archive}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${archive}/pmat" "$RUNNER_TEMP/bin/pmat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/pmat" --version

      - name: pmat comply
        run: pmat comply

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-coverage-${{ runner.os }}-

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org/ | DUCKDB_VERSION="${DUCKDB_VERSION}" sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: data
          key: fixtures-${{ runner.os }}-${{ env.DUCKDB_VERSION }}-${{ hashFiles('scripts/fetch-data.sh') }}

      - name: Fetch fixtures
        run: make fetch

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: Line coverage must stay at 100%
        run: cargo llvm-cov --release --workspace --fail-under-lines 100

  gate:
    name: gate
    needs: [gate-matrix, pv-lint, pmat-comply, coverage]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a gate job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "all gates passed"
